; SuperGUI hardware test: Raspberry Pi Pico 2 W + 320x240 SPI LCD + rotary encoder + 2 buttons.
; Pins and the LovyanGFX display class are yours to fill in: see include/MyLGFX.h and the constants at the top of src/main.cpp.

[env:pico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX@^1.2.21
    ; SuperGUI itself: this repository (two folders up) when built from the repo checkout. To build a copy of this folder on its own,
    ; replace the next line with  https://github.com/JasonBolbach/SuperGUI.git
    symlink://../..
