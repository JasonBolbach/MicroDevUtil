; SuperGUI hardware test: Freenove ESP32-S3-WROOM (8 MB flash, 8 MB PSRAM) + 480x320 touch LCD + rotary encoder + 2 buttons.
; The LovyanGFX display class (with touch) and the pin numbers are yours to fill in:
; see include/LGFX_User.h / include/Pins.h (this board: ST7796 480x320 SPI + FT6336 touch) and the constants at the top of src/main.cpp.

[env:esp32s3]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.flash_mode = qio
; Flash is QIO, but this module's 8 MB PSRAM is OCTAL (opi). Quad mode makes the PSRAM fail to start
; ("PSRAM chip is not connected, or wrong PSRAM line mode"), so there would be no PSRAM at all.
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
;upload_port = /dev/cu.usbmodem1101
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
; serial monitor on the UART port; set to 1 for native USB CDC
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    lovyan03/LovyanGFX@^1.2.21
    ; SuperGUI itself: this repository (two folders up) when built from the repo checkout. To build a copy of this folder on its own,
    ; replace the next line with  https://github.com/JasonBolbach/SuperGUI.git
    symlink://../..
