; SuperGUI hardware demo: Raspberry Pi Pico W / Pico 2 W + 320x240 SPI LCD (TE004) + rotary encoder + 2 buttons.
; Display class: include/LGFX_User_TE004.h   Pins: include/Pins.h   Options: top of src/main.cpp.
;   pio run -e picow -t upload       (Pico W)        pio run -e pico2w -t upload      (Pico 2 W)

[env:picow]                  ; Raspberry Pi Pico W (RP2040)
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX@^1.2.21
    ; SuperGUI itself: this repository (two folders up) when built from the repo checkout. To build a copy of this folder on its own,
    ; replace the next line with  https://github.com/JasonBolbach/SuperGUI.git
    symlink://../..

[env:pico2w]                 ; Raspberry Pi Pico 2 W (RP2350): same project, different board
extends = env:picow
board = rpipico2w
